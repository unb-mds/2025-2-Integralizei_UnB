<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Integralizei UnB — Documentação</title>
  <meta name="description" content="Documentação oficial do projeto Integralizei UnB">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <!-- Tema Docsify (Vue.css) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* Estilização específica solicitada pelo usuário (Gradiente Verde/Azul) */
    section.cover {
      background: linear-gradient(135deg, #10B981, #3B82F6) !important;
      color: white !important;
    }
    section.cover h1, section.cover p, section.cover a {
      color: white !important;
    }
    section.cover a {
      border-color: white !important;
    }
    section.cover a:hover {
      background-color: white !important;
      color: #3B82F6 !important;
    }
    .app-nav {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="app">Carregando...</div>

  <script>
    window.$docsify = {
      name: 'Integralizei UnB',
      repo: 'https://github.com/unb-mds/2025-2-Integralizei_UnB',
      loadSidebar: true,       // Habilita _sidebar.md
      loadNavbar: true,        // Habilita _navbar.md
      coverpage: true,         // Habilita _coverpage.md
      subMaxLevel: 3,          // Subnível de headings no sidebar
      auto2top: true,          // Scroll to top ao navegar
      relativePath: true,      // Links relativos ao arquivo atual
      mergeNavbar: true,       // Merge navbar em mobile
      notFoundPage: true,      // Página 404 customizada

      // Busca
      search: {
        placeholder: 'Pesquisar na documentação...',
        noData: 'Nenhum resultado encontrado.',
        paths: 'auto',
        depth: 3,
        maxAge: 86400000 // 24h cache
      },

      // Paginação (anterior/próximo)
      pagination: {
        previousText: '← Anterior',
        nextText: 'Próximo →',
        crossChapter: true,
        crossChapterText: true
      },

      // Copy code button
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Erro',
        successText: '✓ Copiado!'
      },

      // Tabs
      tabs: {
        persist: true,
        sync: true
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

  <!-- Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>

  <!-- Emoji -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
</body>
</html>
